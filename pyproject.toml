[project]
name = "bitcoin-analysis"
version = "0.1.0"
description = "Bitcoin real-time data ingestion and analysis with logging regression"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Mickael", email = "mickael.rakotoa@gmail.com"}]

dependencies = [
    "requests>=2.32.5",           # HTTP requests (pour CoinGecko API)
    "pandas>=2.1.0",              # Data manipulation
    "pytz>=2023.3",               # Timezone handling
    "dbt-core==1.11.6",
    "pip>=25.3",
    "dbt-postgres>=1.11,<1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.15.1",
    "raw-ingest",
]
analytics = [
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
]
streamlit = [
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Dit à hatchling où est le code
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.workspace]
members = [
    "dbt_silver_gold",
    "dbx_workflow",
]

[tool.uv.sources]
raw-ingest = { workspace = true }

[tool.pytest.ini_options]
norecursedirs = ["markdown", "app", "node_modules", ".venv"]
pythonpath = ["dbx_workflow/src"]
