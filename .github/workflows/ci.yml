name: CI

on:
  push:
    branches:
      - '**'

jobs:
  test_package:
    name: PostgreSQL backend and dbt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:55432/bitcoin_test
      DATABASE_URL: postgresql://postgres@localhost:55432/bitcoin_test
      PGHOST: localhost
      PGPORT: '55432'
      PGUSER: postgres
      PGPASSWORD: ''
      PGDATABASE: bitcoin_test
      DBT_TARGET_SCHEMA: ci

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: bitcoin_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bitcoin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.9.17'
          enable-cache: true

      - name: Verify Python lock
        run: uv lock --check

      - name: Install Python dependencies
        run: uv sync --locked --package raw-ingest --extra dev

      - name: Run Python tests
        run: uv run --locked --package raw-ingest --extra dev pytest dbx_workflow/tests

      - name: Prepare dbt fixtures
        run: uv run --locked --package raw-ingest python -c "import os, pathlib, psycopg; connection = psycopg.connect(os.environ['DATABASE_URL']); connection.execute(pathlib.Path('dbt_silver_gold/tests/fixtures/setup.sql').read_text()); connection.commit(); connection.close()"

      - name: Run dbt debug
        run: uv run --locked --package raw-ingest dbt debug --project-dir dbt_silver_gold --profiles-dir dbt_silver_gold

      - name: Compile dbt project
        run: uv run --locked --package raw-ingest dbt compile --project-dir dbt_silver_gold --profiles-dir dbt_silver_gold

      - name: Build dbt project from scratch
        run: uv run --locked --package raw-ingest dbt build --full-refresh --project-dir dbt_silver_gold --profiles-dir dbt_silver_gold

      - name: Rebuild dbt project to verify idempotence
        run: uv run --locked --package raw-ingest dbt build --project-dir dbt_silver_gold --profiles-dir dbt_silver_gold

  test_app:
    name: Next.js tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: ./app

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Verify npm lock and install dependencies
        run: npm ci

      - name: Type-check application
        run: npx tsc --noEmit

      - name: Lint application
        run: npm run lint

      - name: Run Jest tests
        run: npm test -- --ci --watchAll=false --runInBand

      - name: Build Next.js application
        run: npm run build
